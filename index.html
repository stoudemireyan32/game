<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#221b43"><title>全民训练大模型 · 算力无限三消</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237759bc'/%3E%3Ctext x='4' y='25' font-size='26'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main id="game"><header><div class="title"><span>✦</span><div><b>全民训练大模型</b><small>一直消，一起把模型养大</small></div></div><button id="sound" aria-label="开启或关闭声音"><span>♫</span><small id="sound-state">点按开声</small></button><button id="settings" aria-label="游戏设置">⚙</button></header><section class="resources" aria-label="消除直接获得算力和数据"><div id="compute-box"><span class="res-icon">ϟ</span><div><small>累计游戏算力</small><b><strong id="compute">0</strong> <em>TFLOPS</em></b></div></div><div id="data-box"><span class="res-icon data-glyph">▤</span><div><small>累计训练数据</small><b id="data-total">0 MB</b></div></div></section><section class="gpu-target" aria-label="下一张显卡自动解锁进度"><div id="gpu-thumb" aria-hidden="true"></div><div class="target-info"><div class="target-heading"><span>下一张 <b id="next-gpu">A100</b></span><small>已获得 <b id="card-count">0</b> 张</small></div><div class="gpu-track"><i id="gpu-progress"></i><span id="gpu-progress-label">0 / 312 TFLOPS</span></div><small id="gpu-remaining">再攒312 TFLOPS，自动获得</small></div><span id="gpu-award" aria-live="polite"></span></section><section class="data-target" aria-label="数据累计进度"><span>▤ 数据</span><div><i id="data-progress"></i></div><small id="data-goal">下一模型 0 MB / 256 MB</small></section><div class="play-heading"><span>∞ 无限三消</span><small>已消除 <b id="swaps">0</b> 次</small></div><div id="instruction">滑动交换相邻图标，三个同款成排就消除</div><section id="board-shell"><div id="board" role="group" aria-label="滑动交换相邻图标，三个同款横向或纵向成排即可消除"></div><div id="hand" aria-hidden="true">☝</div><div id="combo" aria-hidden="true"><b id="combo-word"></b><span id="combo-sub"></span></div></section><div class="feedback-row"><span id="feedback">四连 ×1.5 · 五连 ×2 · 连锁赚更多</span><button id="hint" aria-label="提示一个可以消除的交换">✧ 提示</button><button id="shuffle" aria-label="免费重排棋盘">⤨</button></div><section class="reward-strip" id="reward-strip" aria-live="polite"><span class="reward-icon" id="reward-icon">✦</span><div><b id="reward-title">每次消除，算力和数据一起涨</b><small id="reward-detail">攒满进度条，显卡直接送到手上！</small></div><span id="reward-chain"></span></section><section id="model-panel" class="model-panel"><div class="model-orb"><div class="bot"><i></i><i></i><em></em></div><small id="model-size">模型种子</small></div><div class="model-info"><div><b id="model-name">正在孵化你的第一只模型</b><span id="model-status">自动成长</span></div><div class="model-track"><i id="model-progress"></i></div><small id="model-note">攒够算力和数据，自动开始训练</small><small id="served">MaaS 等待开张</small></div></section><div id="effects" aria-hidden="true"></div><div id="gpu-reveal" aria-live="polite"><div class="reveal-rays"></div><span class="reveal-kicker">NEW GPU · 算力突破</span><h2 id="reveal-title"></h2><div id="reveal-card"></div><b id="reveal-spec"></b><small id="reveal-copy"></small></div><div id="toast" role="status"></div><dialog id="modal"><button id="close-modal" aria-label="关闭设置">×</button><div id="modal-content"></div></dialog></main><script src="engine.js"></script><script src="economy.js"></script><script src="content.js"></script><script src="music.js"></script><script src="app.js"></script></body></html>
