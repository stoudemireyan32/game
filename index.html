<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f2154"><title>全民训练大模型 · 滑动三消</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237759bc'/%3E%3Ctext x='4' y='25' font-size='26'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main id="game"><header><div class="title"><span>✦</span><div><b>全民训练大模型</b><small>滑动消除，把小模型养大</small></div></div><button id="sound" aria-label="开启或关闭声音"><span>♫</span><small id="sound-state">点按开声</small></button><button id="settings" aria-label="游戏设置">⚙</button></header><section class="lab-strip" aria-label="正在成长的模型"><div class="model-orb"><div class="bot"><i></i><i></i><em></em></div><span id="model-size">模型种子</span></div><div class="model-info"><div><b id="model-name">等你唤醒第一只模型</b><span id="income-rate">MaaS 尚未开启</span></div><div class="model-track"><i id="model-progress"></i></div><small id="model-note">每次消除，都在为它积累训练资源</small></div></section><div class="wallet"><span id="bag-coins"><i class="resource coin">✦</i><strong id="coins">60</strong><small>金币</small></span><span id="bag-energy"><i class="resource bolt">ϟ</i><strong id="energy">0</strong><small>能量</small></span><span id="bag-data"><i class="resource data">▤</i><strong id="data">0</strong><small>数据</small></span><span id="bag-gpu"><i class="resource chip">▣</i><strong id="gpu-parts">0/6</strong><small>显卡碎片</small></span></div><section class="stage"><span class="stage-number" id="stage-number">第 1 关</span><div><b id="goal">消除 30 个模型图标</b><div class="stage-track"><i id="stage-fill"></i></div></div><span class="moves"><b id="moves">15</b><small>剩余步数</small></span><button id="extra-moves" hidden>免费加 5 步</button></section><div id="instruction">滑动交换相邻图标，三个同款连成排就消除</div><section id="board-shell"><div id="board" role="group" aria-label="滑动交换相邻图标，三个同款横向或纵向成排即可消除"></div><div id="hand" aria-hidden="true">☝</div><div id="combo" aria-hidden="true"></div><div id="board-message" aria-live="polite"></div></section><div class="feedback-row"><span id="feedback">三连得数据 · 四连造芯片 · 五连得万能核心</span><button id="hint" aria-label="提示一个可以消除的交换">☀ 提示</button><button id="shuffle" aria-label="免费重排棋盘">⤨</button></div><section class="reward-strip" id="reward-strip" aria-live="polite"><span class="reward-icon" id="reward-icon">✦</span><div><b id="reward-title">消除奖励会直接飞进你的背包</b><small id="reward-detail">金币、数据、显卡碎片，每次都看得见</small></div><span id="reward-chain"></span></section><section class="growth-action"><div><small id="next-label">下一步的小目标</small><b id="next-goal">35 能量 + 2 份数据，唤醒豆豆 0.1B</b><span id="next-detail">不用离开棋盘，资源够了就在这里训练</span></div><button id="grow">继续消除</button></section><div id="effects" aria-hidden="true"></div><div id="toast" role="status"></div><dialog id="modal"><button id="close-modal" aria-label="关闭设置">×</button><div id="modal-content"></div></dialog></main><script src="engine.js"></script><script src="content.js"></script><script src="music.js"></script><script src="app.js"></script></body></html>
