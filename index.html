/* Original toy-funk music plus locally rendered announcer, all decoded from embedded bytes. */
window.GameAudio=(function(){
 let context,master,musicBus,fxBus,voiceBus,analyser,compressor,loop,decodeTask,interacted=false,musicOn=true,sfxOn=true,voiceOn=true,activeVoice,lastSpeech=-100,priority=0,voices=0;const buffers={},events=[];
 function init(){if(context)return;context=new(window.AudioContext||window.webkitAudioContext)();master=context.createGain();master.gain.value=.85;musicBus=context.createGain();musicBus.gain.value=musicOn?.48:0;fxBus=context.createGain();fxBus.gain.value=sfxOn?.8:0;voiceBus=context.createGain();voiceBus.gain.value=voiceOn?.9:0;compressor=context.createDynamicsCompressor();compressor.threshold.value=-10;compressor.ratio.value=3;compressor.knee.value=14;analyser=context.createAnalyser();analyser.fftSize=512;musicBus.connect(master);fxBus.connect(master);voiceBus.connect(master);master.connect(compressor);compressor.connect(analyser);analyser.connect(context.destination);decodeTask=Promise.all(Object.entries(window.GAME_CONTENT.audio||{}).map(async([key,data])=>{const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0));try{buffers[key]=await context.decodeAudioData(bytes.buffer);}catch{events.push({kind:'decode-error',key});}}));}
 function record(kind,extra={}){events.push({kind,at:context?.currentTime||0,...extra});if(events.length>40)events.shift();}
 function startLoop(){if(!context||context.state!=='running'||!musicOn||loop||!buffers.loop)return;loop=context.createBufferSource();loop.buffer=buffers.loop;loop.loop=true;loop.connect(musicBus);loop.start();record('bgm');}
 function stopLoop(){if(loop){loop.stop();loop.disconnect();loop=null;}}
 async function unlock(){interacted=true;try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch{}try{init();if(context.state!=='running')await context.resume();await decodeTask;startLoop();return context.state==='running';}catch{return false;}}
 function configure(opts){if(typeof opts.music==='boolean')musicOn=opts.music;if(typeof opts.sound==='boolean')sfxOn=opts.sound;if(typeof opts.voice==='boolean')voiceOn=opts.voice;if(context){musicBus.gain.cancelScheduledValues(context.currentTime);musicBus.gain.setTargetAtTime(musicOn?.48:0,context.currentTime,.04);fxBus.gain.setTargetAtTime(sfxOn?.8:0,context.currentTime,.02);voiceBus.gain.setTargetAtTime(voiceOn&&sfxOn?.9:0,context.currentTime,.02);if(!sfxOn||!voiceOn){if(activeVoice){activeVoice.stop();activeVoice=null;}}}if(!musicOn)stopLoop();else if(interacted)unlock();}

function tokenSize(n){if(n>=1e8)return +(n/1e8).toFixed(1)+'亿';if(n>=1e4)return +(n/1e4).toFixed(1)+'万';return fmt(n);}
function startTraining(){const m=nextModel();if(!state.training&&m&&state.cards>=m.cards&&state.dataMB>=m.dataMB){const now=Date.now();state.training={tier:state.models.length,start:now,end:now+m.seconds*1000};$('#model-panel').classList.add('training');toast(m.size+'模型开始自动训练，继续三消就好！');A.effect('train');save();}}
function advance(){const now=Date.now(),from=Math.min(now,Math.max(state.last,now-7200000));let rate=state.models.reduce((a,n)=>a+P.models[n].tokens,0),tokens=(now-from)/1000*rate;if(state.training&&now>=state.training.end){const t=state.training;if(!state.models.includes(t.tier)){state.models.push(t.tier);const m=P.models[t.tier];tokens+=Math.max(0,now-Math.max(from,t.end))/1000*m.tokens;toast(m.size+'模型诞生！已自动上线 MaaS。');A.effect('win');confetti();}state.training=null;}state.servedTokens+=tokens;state.last=now;startTraining();refresh();save();showNextGPU();}
function refresh(){if(!state.board)return;const milestone=P.milestone(state.compute,state.cards),next=nextModel(),current=P.models[state.models.at(-1)];$('#compute').textContent=fmt(state.compute);$('#data-total').textContent=P.dataSize(state.dataMB);$('#card-count').textContent=state.cards;$('#gpu-award').textContent=state.cards?P.gpuAt(state.cards-1).name+' ×'+(state.cards===1?1:state.cards-1):'';$('#next-gpu').textContent=milestone.card.name;$('#gpu-progress-label').textContent=fmt(Math.min(milestone.progress,milestone.target))+' / '+fmt(milestone.target)+' TFLOPS';$('#gpu-progress').style.width=Math.min(100,milestone.progress/milestone.target*100)+'%';$('#gpu-remaining').textContent='再攒 '+fmt(milestone.remaining)+' TFLOPS，自动获得';if($('#gpu-thumb').dataset.card!==milestone.card.name)$('#gpu-thumb').innerHTML=gpuArt(milestone.card);$('#gpu-thumb').dataset.card=milestone.card.name;$('#data-progress').style.width=(next?Math.min(100,state.dataMB/next.dataMB*100):100)+'%';$('#data-goal').textContent=next?'下一模型 '+P.dataSize(state.dataMB)+' / '+P.dataSize(next.dataMB):'数据持续积累 · 全部模型已解锁';$('#swaps').textContent=fmt(state.swaps);$('#model-panel').classList.toggle('training',!!state.training);$('#model-size').textContent=current?current.size:'模型种子';$('#model-name').textContent=current?current.name+' · '+current.size:'正在孵化你的第一只模型';$('#served').textContent=state.models.length?'MaaS 已服务 '+tokenSize(state.servedTokens)+' Token':'算力和数据攒够，模型自动训练';if(state.training){const t=state.training;$('#model-progress').style.width=Math.min(100,(now()-t.start)/(t.end-t.start)*100)+'%';$('#model-note').textContent=P.models[t.tier].size+'训练中 · '+Math.max(0,Math.ceil((t.end-now())/1000))+'秒';$('#model-status').textContent='训练中';}else{$('#model-progress').style.width=next?Math.min(100,Math.min(state.cards/next.cards,state.dataMB/next.dataMB)*100)+'%':'100%';$('#model-note').textContent=next?'下一只 '+next.size+' · 显卡 '+state.cards+'/'+next.cards+' · 数据 '+P.dataSize(state.dataMB)+'/'+P.dataSize(next.dataMB):'128B MoE 已上线 · 三消与显卡收集无限继续';$('#model-status').textContent=next?'自动成长':'已上线';}soundStatus();}
const now=()=>Date.now();
function showModal(html){$('#modal-content').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();}
function hideModal(){$('#modal').close();showNextGPU();}
function settings(){const info=A.inspect();showModal(`<h2 class="modal-title">声音与玩法</h2>${[['sound','消除音效'],['music','玩具放克 BGM'],['voice','连击人声喝彩']].map(([key,name])=>`<div class="setting-row"><span>${name}</span><button data-toggle="${key}" class="${state[key]?'':'off'}">${state[key]?'已开启':'已关闭'}</button></div>`).join('')}<p class="audio-status">${info.state==='running'?'声音正在运行':'点试听激活手机声音'} · 内置音乐与人声，无需联网加载</p><button class="modal-action" data-action="audition">♫ 试听音乐 + Unbelievable!</button><p class="modal-copy">相邻交换，三个同款横向/纵向成排即消除。四连生成行/列芯片并获得 1.5 倍资源，五连生成万能核心并获得 2 倍资源。连锁还有额外加成。滑动特殊芯片可发动技能。</p><p class="modal-copy">每次直接累计算力和数据，进度满自动获得显卡。模型条件满足后自动训练、上线；没有关卡、步数限制或购买操作。</p><button class="sub-action" data-action="about">显卡规格、单位与素材来源</button><button class="sub-action" data-action="log">查看云端执行日志</button><button class="sub-action danger" data-action="reset-view">重置本版进度 · 需确认</button><button class="modal-action" data-action="close">继续消除</button>`);}
function about(){showModal(`<h2 class="modal-title">显卡与游戏进度</h2><div class="spec-list">${P.gpus.map(g=>`<p><b>NVIDIA ${g.name} SXM</b><br>${g.architecture} · ${g.memory}<br>带宽 ${g.bandwidth}<br>FP16 / BF16 稠密 Tensor 峰值 ${g.peak} TFLOPS<br><a href="${g.source}" target="_blank" rel="noopener noreferrer">NVIDIA 官方资料 ↗</a></p>`).join('')}</div><p class="notes">TFLOPS = 每秒万亿次浮点运算，是速率单位；本游戏把它映射成可累加的算力进度，用于自动解锁显卡，不代表真实累计计算工作量。解锁门槛不等于硬件规格。普通三消 +78 进度、+96 MB 数据；首张 A100 要312，下一张 H100 要780。以后继续装 H100 扩大集群。</p><p class="notes">数据容量采用 1024 MB = 1 GB、1024 GB = 1 TB 的游戏显示约定；字节容量不直接等于 Token 数，不按固定比例换算。数据不会被训练扣除；模型为模拟自动训练，不实际调用这些品牌服务。</p><div class="brand-gallery">${C.brands.map(b=>`<div>${b.svg}<b>${esc(b.name)}</b></div>`).join('')}</div><p class="notes">品牌 SVG：Lobe Icons ${C.iconVersion}，MIT。原创玩具放克音乐；喝彩由本地 Flite 合成并加工，不使用商业游戏原声。完整来源在项目 vendor 目录。</p><details><summary>图标许可</summary><pre class="license">${esc(C.iconLicense)}</pre></details><p class="notes">无支付、无登录、无广告、无个人数据上报。进度存在当前浏览器，旧版独立保留。</p><button class="modal-action" data-action="close">继续三消</button>`);}
function logs(){showModal(`<h2 class="modal-title">云端执行日志</h2><p class="notes">北京时间 · 实际完成记录快照</p>${(window.GAME_PROGRESS||[]).map(x=>`<article class="log-item"><time>${esc(x.beijing)}</time><p>${esc(x.message)}</p></article>`).join('')}<button class="modal-action" data-action="close">继续消除</button>`);}
function resetView(){showModal('<h2 class="modal-title">重新开始？</h2><p class="modal-copy">将清空本版算力、数据、显卡和模型。此前版本存档保留。</p><button class="modal-action" data-action="reset">确认重置本版</button><button class="sub-action" data-action="close">取消</button>');}
function reset(){epoch++;clearTimeout(revealTimer);revealActive=false;$('#gpu-reveal').classList.remove('show');clearDrag();state=fresh();newBoard();busy=false;selected=null;hideModal();A.configure({sound:true,music:true,voice:true});renderBoard();refresh();save();rewardCard('新旅程开始！','向上滑发光鲸鱼，先来一次四连','gpu');}
document.addEventListener('pointerup',unlock);document.addEventListener('touchend',unlock,{passive:true});document.addEventListener('click',e=>{unlock();const b=e.target.closest('button');if(!b||b.disabled||b.classList.contains('tile'))return;if(b.dataset.toggle){const key=b.dataset.toggle;if(['sound','music','voice'].includes(key)){state[key]=!state[key];A.configure({music:state.music,sound:state.sound,voice:state.voice});save();settings();}return;}({close:hideModal,about,log:logs,'reset-view':resetView,reset,audition:()=>{state.sound=state.music=state.voice=true;A.configure({sound:true,music:true,voice:true});unlock().then(()=>{A.effect('power');A.say('unbelievable',10,true)});save();settings();}})[b.dataset.action]?.();});
$('#hint').onclick=hint;$('#shuffle').onclick=shuffle;$('#settings').onclick=settings;$('#close-modal').onclick=hideModal;$('#sound').addEventListener('pointerdown',()=>{soundPress=!((state.music||state.sound)&&A.inspect().state==='running');});$('#sound').onclick=()=>{const on=soundPress??!((state.music||state.sound)&&A.inspect().state==='running');soundPress=null;state.music=state.sound=on;A.configure({music:on,sound:on,voice:state.voice});unlock();if(on)A.effect('pick');refresh();save();};
$('#modal').addEventListener('click',e=>{if(e.target!==$('#modal'))return;const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)hideModal();});
window.addEventListener('resize',()=>{clearDrag();$('#hand').hidden=true;});window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){clearDrag();A.pause();save();}else{advance();A.resume();}});
ensure();A.configure({music:state.music,sound:state.sound,voice:state.voice});renderBoard();advance();save();if(state.swaps===0&&state.board.tutorial){hints=[state.board.tutorial.a,state.board.tutorial.b];renderBoard();$('#instruction').textContent='把发光鲸鱼向上滑，四连奖励更多！';}if(E.scan(state.board).indices.length||state.pendingPower)settle(state.pendingPreferred);else if(!E.move(state.board))shuffle();setInterval(advance,300);
</script></body></html>
