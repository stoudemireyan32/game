function showBirth(i){const m=C.models[i];open(`<div class="eyebrow">YOUR MODEL IS READY</div><h2 class="sheet-title">你好，我叫${m.name}！</h2>${pod()}<div class="benefits"><div><b>${m.size}</b><small>你亲手训练的模型</small></div><div><b>+${m.rate} / 秒</b><small>已自动开启 MaaS 收益</small></div></div><p class="sheet-copy">你的每一次连接，都在让我长大。<br>我会继续工作，替你攒下一张显卡的钱。</p><button class="sheet-action" data-action="close">继续玩，一起变强！</button><p class="sheet-note">点顶部金币气泡收收益；离线最多计 2 小时，待领取上限 5,000。</p>`);}
function claim(){advance();const n=Math.floor(state.pending);if(!n){toast(state.models.length?'小模型正在工作，稍后再来收金币吧。':'先训练第一只模型，它就能替你赚金币啦。');return;}state.pending-=n;state.coins+=n;state.claimed+=n;A.effect('coin');floatReward($('#income'),'+'+n+' ✦');refresh();save();}
function gpuPanel(){open(`<div class="eyebrow">MORE POWER, MORE POSSIBILITIES</div><h2 class="sheet-title">给模型，升级算力</h2><p class="sheet-copy">金币：✦ ${fmt(state.coins)} · 显卡升级永久生效</p>${C.gpus.map((g,i)=>`<div class="shop-card ${state.gpu===i?'active':''}"><span class="gpu-icon"><i></i><i></i></span><div><h3>${g.name}</h3><p>${i?'解锁 '+C.models[i].size+' · 训练速度 ×'+g.speed:'已为你装好，可训练 0.1B'}</p><button class="details-button" data-spec="${i}">硬件科普 ↗</button></div>${i<=state.gpu?'<span class="owned">已解锁 ✓</span>':`<button class="buy" data-buy-gpu="${i}">✦ ${g.cost}</button>`}</div>`).join('')}<p class="sheet-note">价格、倍率和训练门槛为虚构游戏数值；真实规格另附官方来源。</p>`);}
function buyGpu(i){const g=C.gpus[i];if(!g||i<=state.gpu)return;if(state.coins<g.cost){toast('还差 '+fmt(g.cost-state.coins)+' 金币，连连看就能赚到。');A.effect('error');return;}state.coins-=g.cost;state.gpu=i;A.effect('buy');save();refresh();gpuPanel();confetti();toast(g.name+'已装好，可以训练更大的模型！');}
function specPanel(i){const g=C.gpus[i];open(`<div class="eyebrow">GPU FIELD NOTES</div><h2 class="sheet-title">${g.name}</h2><p class="spec-copy">${g.spec}${g.source?`<br><a href="${g.source}" target="_blank" rel="noopener noreferrer">NVIDIA 官方资料 ↗</a>`:''}</p><p class="sheet-copy">硬件图形是游戏化表现。游戏的价格、倍率和训练规模不代表真实训练成本或性能。</p><button class="sheet-action" data-panel="gpu">返回显卡机房</button>`);}
function dataPanel(){const next=nextModel();open(`<div class="eyebrow">DATA IS THE SEED</div><h2 class="sheet-title">我的训练数据</h2><p class="sheet-copy">每连接 3 对模型图标，提炼 1 份训练数据。<br>${next?'下一只模型需要 '+C.datasets[next.domain]+'数据。':'继续积累，准备下一段旅程。'}</p>${C.datasets.map((name,i)=>`<div class="shop-card"><span class="data-icon"><i></i><i></i><i></i></span><div><h3>${name}</h3><p>库存 ${state.data[i]} 份 ${next?.domain===i?'· 下次训练需要':''}</p></div><button class="buy" data-buy-data="${i}">✦ 25</button></div>`).join('')}<button class="soft-button" data-action="close">继续连接，免费收集</button><p class="sheet-note">图标是游戏配对主题，不代表真实调用或获取品牌模型的训练数据。</p>`);}
function buyData(i){if(!C.datasets[i])return;if(state.coins<25){toast('金币不够啦，连连看也能免费获得数据。');return;}state.coins-=25;state.data[i]++;A.effect('buy');save();refresh();dataPanel();toast(C.datasets[i]+'数据 +1');}
function modelsPanel(){open(`<div class="eyebrow">THE MODELS YOU RAISED</div><h2 class="sheet-title">我的模型小队</h2><p class="sheet-copy">从 0.1B 开始，每一步成长都由你创造。<br>小队产出：${rate()} 金币 / 秒</p><div class="collection">${C.models.map((m,i)=>`<div class="model-card ${state.models.includes(i)?'':'locked'}"><span class="bot-face"><i></i><i></i><em></em></span><h3>${m.name} · ${m.size}</h3><small>${state.models.includes(i)?'已训练 · +'+m.rate+' 金币/秒':state.training?.tier===i?'正在学习中':'等待你来唤醒'}</small></div>`).join('')}</div><p class="sheet-note">本版成长到 7B，后续可扩展蒸馏与 MoE。没有真实模型训练或真实评测成绩。</p><button class="sheet-action" data-action="grow">${nextModel()?'准备下一只模型':'继续连连看，积累资源'}</button>`);}
function settingsPanel(){open(`<div class="eyebrow">MAKE IT SOUND LIKE YOU</div><h2 class="sheet-title">声音与存档</h2><div class="setting"><span>金币与连接音效</span><button class="toggle ${state.sound?'on':''}" data-toggle="sound">${state.sound?'已开启':'已关闭'}</button></div><div class="setting"><span>原创背景音乐</span><button class="toggle ${state.music?'on':''}" data-toggle="music">${state.music?'已开启':'已关闭'}</button></div><div class="music-row"><button class="music-choice ${state.theme==='arcade'?'active':''}" data-theme="arcade">♫ 街机律动</button><button class="music-choice ${state.theme==='soft'?'active':''}" data-theme="soft">♪ 轻快旋律</button></div><p class="sheet-copy">街机律动：八小节原创旋律，加入贝斯、鼓点和镲片。<br>首次点击后播放，两个音轨都可单独关闭。</p><p class="sheet-note">${storageWarning?'浏览器禁止存档，本次可以玩，但关闭后可能丢失进度。':'进度只保存在当前浏览器，无需登录。'}<br>旧版进度独立保留；这里的重置不会删除旧版存档。</p><button class="sheet-action" data-action="close">继续连连看</button><button class="soft-button" data-panel="log">查看云端制作日志</button><button class="danger" data-action="reset-view">重新开始 · 需再次确认</button>`);}
function aboutPanel(){open(`<div class="eyebrow">CLASSIC LINK, YOUR OWN MODEL</div><h2 class="sheet-title">经典连连看，模型新玩法</h2><div class="how-row"><span>①</span><p><b>点两个相同的模型图标</b><br>连线不能穿过其他牌，最多拐两次弯，也可以绕棋盘边缘。</p></div><div class="how-row"><span>②</span><p><b>连接就掉金币和能量</b><br>每连接三对，额外获得一份训练数据。没有可连的会自动免费排列。</p></div><div class="how-row"><span>③</span><p><b>升级显卡，训练自己的模型</b><br>模型在你玩的时候继续学习，完成后自动赚虚拟收益。</p></div><div class="brand-gallery">${C.brands.map(b=>`<div class="brand-card">${b.svg}<b>${esc(b.name)}</b></div>`).join('')}</div><div class="source-links">图标来自 <a href="https://github.com/lobehub/lobe-icons" target="_blank" rel="noopener noreferrer">Lobe Icons ${C.iconVersion}</a>，按 MIT 许可使用。品牌名称及商标归各权利方，游戏不代表与品牌合作。OpenAI、Claude 与千问等在此仅为配对主题。<br>规则参考：<a href="https://en.wikipedia.org/wiki/Shisen-Sho" target="_blank" rel="noopener noreferrer">Shisen-Sho / 四川麻将连连看</a>。</div><details><summary>图标开源许可</summary><pre class="license">${esc(C.iconLicense)}</pre></details><button class="soft-button" data-panel="log">查看带时间的云端制作日志</button><button class="soft-button" data-action="quiz">知识彩蛋：答对额外赚能量</button><p class="sheet-note">无账号、无支付、无广告、无个人数据上报。所有货币、参数成长和 MaaS 收益是虚拟游戏设定。页面已内置图标、样式与程序，无需下载素材。</p>`);}
function quiz(){if(Date.now()-state.quizAt<45000){toast('彩蛋休息中，稍后再来挑战。');return;}const pool=[{q:'H100 和 H200 属于哪代架构？',options:['Hopper','Blackwell','Ampere'],answer:0,explain:'H100、H200 属于 Hopper；B200 属于 Blackwell。'},{q:'蒸馏通常是让学生模型学习什么？',options:['教师模型的输出或表示','风扇转速','压缩包文件名'],answer:0,explain:'模型蒸馏利用教师输出或内部表示指导学生训练。'},{q:'FlashAttention 主要优化什么？',options:['显示器刷新率','注意力计算的内存读写','鼠标点击速度'],answer:1,explain:'它通过分块等方式减少内存读写，优化注意力计算。'}];const q=pool[state.quizCount%pool.length];state.quizAt=Date.now();state.quizCount++;save();let answered=false;const end=Date.now()+15000;open(`<div class="eyebrow">OPTIONAL KNOWLEDGE BONUS</div><h2 class="sheet-title">给大脑也加点算力</h2><p class="sheet-copy important">${q.q}</p><div id="quiz-answers">${q.options.map((x,i)=>`<button class="quiz-answer" data-answer="${i}">${String.fromCharCode(65+i)} · ${x}</button>`).join('')}</div><p class="sheet-copy" id="quiz-result">15 秒内答对，能量 +30；不影响主线。</p>`);function finish(a){if(answered)return;answered=true;clearInterval(quizTimer);$$('[data-answer]').forEach(b=>{b.disabled=true;b.classList.toggle('correct',Number(b.dataset.answer)===q.answer);});if(a===q.answer){state.energy+=30;A.effect('coin');$('#quiz-result').textContent='答对啦！能量 +30。'+q.explain;}else $('#quiz-result').textContent=(a===null?'时间到了。':'下次再试。')+q.explain;refresh();save();}$('#quiz-answers').onclick=e=>{const b=e.target.closest('[data-answer]');if(b)finish(Number(b.dataset.answer));};quizTimer=setInterval(()=>{if(Date.now()>=end)finish(null);},100);}
function resetView(){open('<h2 class="sheet-title">确定重新开始吗？</h2><p class="sheet-copy">这会清空本浏览器里连连看版的金币、能量、模型和关卡，不能撤销。旧版存档不受影响。</p><button class="sheet-action gold" data-action="reset">确认清空连连看版进度</button><button class="soft-button" data-action="close">保留进度，继续玩</button>');}
function logPanel(){const entries=window.GAME_PROGRESS||[];open(`<div class="eyebrow">CLOUD WORK JOURNAL · ASIA/SHANGHAI</div><h2 class="sheet-title">云端制作日志</h2><p class="sheet-copy">北京时间 · 只记录真实完成的节点<br>这是此版本的日志快照，不是后台在线状态指示器。</p><div class="progress-log">${entries.length?entries.map(x=>`<article><time>${esc(x.beijing)}</time><p>${esc(x.message)}</p></article>`).join(''):'<p>本地源码预览不带日志，请打开打包试玩版。</p>'}</div><button class="sheet-action" data-action="close">返回游戏</button>`);}
const panels={log:logPanel,gpu:gpuPanel,data:dataPanel,models:modelsPanel,settings:settingsPanel,about:aboutPanel};
document.addEventListener('pointerdown',()=>{interacted=true;A.unlock();});
$('#board').addEventListener('click',e=>{const tile=e.target.closest('[data-cell]');if(tile&&!tile.disabled)pick(Number(tile.dataset.cell));});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||b.dataset.cell!==undefined||b.dataset.answer!==undefined)return;if(b.dataset.panel){A.effect('tap');panels[b.dataset.panel]?.();return;}if(b.dataset.buyGpu!==undefined){buyGpu(Number(b.dataset.buyGpu));return;}if(b.dataset.buyData!==undefined){buyData(Number(b.dataset.buyData));return;}if(b.dataset.spec!==undefined){specPanel(Number(b.dataset.spec));return;}if(b.dataset.toggle){const key=b.dataset.toggle;if(['sound','music'].includes(key)){state[key]=!state[key];A.configure({music:state.music,sound:state.sound,theme:state.theme});A.effect('tap');save();settingsPanel();}return;}if(b.dataset.theme){state.theme=b.dataset.theme==='soft'?'soft':'arcade';A.configure({theme:state.theme});save();settingsPanel();return;}const action=b.dataset.action;({hint,shuffle:()=>reshuffle(false),grow,claim,close,win:showWin,'next-level':nextLevel,'start-training':train,quiz,'reset-view':resetView,reset:()=>{epoch++;state=fresh();newBoard();combo=0;lastPair=0;toastReady='';close();A.configure({music:true,sound:true,theme:'arcade'});renderBoard();save();toast('新的模型宇宙，重新出发！');}})[action]?.();});
$('#settings').onclick=settingsPanel;$('#close-modal').onclick=close;$('#modal').addEventListener('close',()=>clearInterval(quizTimer));$('#modal').addEventListener('click',e=>{if(e.target!==$('#modal'))return;const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();});
window.addEventListener('resize',()=>{clearTimeout(lineTimer);$('#connection').classList.remove('show');$('#first-hand').hidden=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){A.pause();save();}else{advance();A.resume();}});window.addEventListener('pagehide',save);
ensureBoard();A.configure({music:state.music,sound:state.sound,theme:state.theme});advance();renderBoard();save();if(!remaining())setTimeout(()=>{if(!remaining()&&!$('#modal').open)showWin();},300);else if(!E.findMove(state.board))reshuffle(true);setInterval(advance,500);
</script></body></html>
