 function scan(b){const groups=[];function line(ids,axis){let start=0;while(start<ids.length){const first=b.cells[ids[start]];if(!first){start++;continue;}let end=start+1;while(end<ids.length&&b.cells[ids[end]]?.kind===first.kind)end++;if(end-start>=3)groups.push({ids:ids.slice(start,end),kind:first.kind,axis});start=end;}}
  for(let r=0;r<b.rows;r++)line(Array.from({length:b.cols},(_,c)=>r*b.cols+c),'row');
  for(let c=0;c<b.cols;c++)line(Array.from({length:b.rows},(_,r)=>r*b.cols+c),'col');

 }
 function swap(b,a,z){if(!adjacent(b,a,z))return false;[b.cells[a],b.cells[z]]=[b.cells[z],b.cells[a]];return true;}
 function isValidSwap(b,a,z){if(!adjacent(b,a,z)||!b.cells[a]||!b.cells[z])return false;if(b.cells[a].power||b.cells[z].power)return true;swap(b,a,z);const m=scan(b);swap(b,a,z);return m.indices.includes(a)||m.indices.includes(z);}
 function move(b){for(let a=0;a<b.cells.length;a++)for(const z of [a+1,a+b.cols])if(adjacent(b,a,z)&&isValidSwap(b,a,z))return {a,b:z};return null;}
 function shuffled(a,rng=Math.random){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
 function generate(rows,cols,types,make,rng=Math.random,intro=false){if(rows<3||cols<3||rows*cols>100||types<4)throw Error('Invalid board dimensions');for(let attempt=0;attempt<500;attempt++){const cells=[];for(let i=0;i<rows*cols;i++){const r=Math.floor(i/cols),c=i%cols;const options=Array.from({length:types},(_,n)=>n).filter(n=>!(c>=2&&cells[i-1].kind===n&&cells[i-2].kind===n)&&!(r>=2&&cells[i-cols].kind===n&&cells[i-cols*2].kind===n));cells.push(make(options[Math.floor(rng()*options.length)],''));}const b={rows,cols,cells};let tutorial=null;if(intro&&rows>=4&&cols>=6){const r=Math.min(2,rows-3),c=3;for(const at of [r*cols+1,r*cols+2,r*cols+4,(r+1)*cols+c])b.cells[at].kind=0;b.cells[r*cols+c].kind=1;for(const at of [r*cols,r*cols+5,(r-1)*cols+c,(r+2)*cols+c])if(b.cells[at].kind===0)b.cells[at].kind=2;tutorial={a:(r+1)*cols+c,b:r*cols+c};}if(!scan(b).indices.length&&move(b))return {...b,tutorial};}throw Error('Could not generate a stable board');}
 function shuffle(b,rng=Math.random){for(let n=0;n<1000;n++){const candidate={...b,cells:shuffled(b.cells,rng)};if(!scan(candidate).indices.length&&move(candidate))return candidate;}throw Error('Could not shuffle board');}

  const crosses=matches.indices.filter(i=>matches.groups.filter(g=>g.ids.includes(i)).length>1);for(const index of crosses)if(!b.cells[index]?.power)creations.set(index,{index,kind:b.cells[index].kind,power:'bomb'});
  const seen=new Set();for(const i of clear){const tile=b.cells[i];if(!tile?.power||seen.has(i))continue;seen.add(i);const r=Math.floor(i/b.cols),c=i%b.cols;
   if(tile.power==='row')for(let x=0;x<b.cols;x++)clear.add(r*b.cols+x);
   if(tile.power==='col')for(let y=0;y<b.rows;y++)clear.add(y*b.cols+c);
   if(tile.power==='bomb')for(let y=Math.max(0,r-1);y<=Math.min(b.rows-1,r+1);y++)for(let x=Math.max(0,c-1);x<=Math.min(b.cols-1,c+1);x++)clear.add(y*b.cols+x);
   if(tile.power==='color'){const kind=targetKind===null?tile.kind:targetKind;b.cells.forEach((t,k)=>{if(t?.kind===kind)clear.add(k);});}
  }
  return {clear:[...clear].filter(i=>b.cells[i]),creations:[...creations.values()],groups:matches.groups,activated:seen.size};
 }

/* Original eight-bar loop: lead, bass, kick, snare, hats and a quiet pad. */
window.GameAudio=(function(){
  let context,master,musicBus,fxBus,compressor,analyser,noise,timer,nextTime=0,step=0,voices=0,interacted=false;
  let musicOn=true,sfxOn=true,style='arcade';const events=[];
  const hz=n=>440*Math.pow(2,(n-69)/12);
  const hooks=[
    [76,-1,79,81,-1,79,76,-1,84,-1,83,79,76,-1,74,-1],
    [72,-1,76,79,-1,76,72,-1,74,76,-1,79,76,-1,72,-1],
    [77,-1,81,84,-1,81,77,-1,79,-1,81,79,77,76,74,-1],

  function voice(freq,time,length,volume,wave='triangle',bus=musicBus,glide=null){const o=context.createOscillator(),g=context.createGain();o.type=wave;o.frequency.setValueAtTime(freq,time);if(glide)o.frequency.exponentialRampToValueAtTime(glide,time+length*.8);g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(volume,time+.006);g.gain.exponentialRampToValueAtTime(.0001,time+length);o.connect(g);g.connect(bus);voices++;o.onended=()=>{voices--;o.disconnect();g.disconnect();};o.start(time);o.stop(time+length+.015);}
  function percussion(time,kind){if(kind==='kick'){voice(130,time,.16,.17,'sine',musicBus,43);return;}const n=context.createBufferSource(),filter=context.createBiquadFilter(),g=context.createGain();n.buffer=noise;filter.type=kind==='hat'?'highpass':'bandpass';filter.frequency.value=kind==='hat'?6800:1900;filter.Q.value=.7;const len=kind==='hat'?.035:.105;g.gain.setValueAtTime(kind==='hat'?.03:.095,time);g.gain.exponentialRampToValueAtTime(.0001,time+len);n.connect(filter);filter.connect(g);g.connect(musicBus);voices++;n.onended=()=>{voices--;n.disconnect();filter.disconnect();g.disconnect();};n.start(time);n.stop(time+len);}
  function plan(s,time){const bar=Math.floor(s/16)%8,pos=s%16,theme=bar%4,note=hooks[theme][pos];if(note>=0){const octave=bar>=4&&pos===0?12:0;voice(hz(note+octave),time,.20,.11,style==='arcade'?'triangle':'sine');if(style==='arcade'&&pos%4===0)voice(hz(note+octave+12),time+.012,.095,.03,'sine');}const roots=[48,45,41,43],root=roots[theme];if(pos%4===0)voice(hz(root+(pos===8?7:0)),time,.26,.075,'triangle');if(pos===0){voice(hz(root+12),time,.68,.022,'sine');voice(hz(root+16),time,.65,.015,'sine');}if(style==='arcade'){if(pos===0||pos===8||pos===11)percussion(time,'kick');if(pos===4||pos===12)percussion(time,'snare');if(pos%2===0)percussion(time,'hat');}else if(pos===0||pos===8)percussion(time,'hat');}

  function effect(kind='tap',combo=1){if(!sfxOn)return;try{init();events.push({kind,at:context.currentTime});if(events.length>20)events.shift();const time=context.currentTime+.012;const notes=({tap:[740],pick:[740],swap:[440,660],match:[988,1319,1760],link:[988,1319,1760],coin:[1319,1760,2093],win:[523,659,784,1047,1319],buy:[523,659,784,1047],power:[392,587,784,1175],error:[240,190]})[kind]||[740];const shift=['match','link'].includes(kind)?Math.min(5,combo-1)*.025:0;notes.forEach((f,i)=>voice(f*(1+shift),time+i*.055,['tap','pick'].includes(kind)?.07:.2,['tap','pick'].includes(kind)?.075:.14,'sine',fxBus));}catch{}}

'use strict';

function fresh(){return {version:4,coins:60,energy:0,data:[0,0,0],gpu:0,gpuParts:0,models:[],training:null,income:0,last:Date.now(),level:1,stage:null,moves:15,swaps:0,cleared:0,serial:0,board:null,ice:[],pendingPower:null,pendingPreferred:null,music:true,sound:true,theme:'arcade'};}
function valid(s){return s&&s.version===4&&['coins','energy','gpuParts','income','last','swaps','cleared','serial'].every(k=>Number.isFinite(s[k])&&s[k]>=0)&&Number.isInteger(s.gpu)&&s.gpu>=0&&s.gpu<=3&&Array.isArray(s.data)&&s.data.length===3&&s.data.every(n=>Number.isInteger(n)&&n>=0)&&Array.isArray(s.models)&&s.models.length<=4&&s.models.every((n,i)=>n===i)&&Number.isInteger(s.level)&&s.level>0&&typeof s.music==='boolean'&&typeof s.sound==='boolean'&&(s.training===null||(s.training.tier===s.models.length&&s.training.tier<4&&Number.isFinite(s.training.start)&&s.training.end>s.training.start));}
let state;try{state=JSON.parse(localStorage.getItem(KEY));if(!valid(state))state=fresh();}catch{state=fresh();}
let soundPress=null;

function make(kind,power=''){return {uid:'t'+(++state.serial),kind,power};}

function setIce(){state.ice=Array(state.board.cells.length).fill(0);if(state.stage.iceTarget){const candidates=Array.from({length:state.board.cells.length},(_,i)=>i);for(let i=0;i<state.stage.iceTarget;i++){const at=Math.floor(Math.random()*candidates.length),index=candidates.splice(at,1)[0];state.ice[index]=state.level>=7?2:1;}}}
function newBoard(){const height=Math.min(innerHeight,930),rows=height<630?4:height<750?6:7;state.board=E.generate(rows,6,typeCount(),make,Math.random,state.swaps===0);state.stage=stageSpec();state.moves=14+Math.min(state.level,7);setIce();selected=null;hints=[];state.pendingPower=null;state.pendingPreferred=null;epoch++;}
function ensure(){const b=state.board,good=b&&Number.isInteger(b.rows)&&b.rows>=4&&b.rows<=8&&b.cols===6&&Array.isArray(b.cells)&&b.cells.length===b.rows*b.cols&&new Set(b.cells.map(t=>t?.uid)).size===b.cells.length&&b.cells.every(t=>t&&/^t\d+$/.test(t.uid)&&Number.isInteger(t.kind)&&t.kind>=0&&t.kind<8&&['','row','col','bomb','color'].includes(t.power));if(!good)newBoard();if(!state.stage||!['target','cleared','broken','iceTarget'].every(k=>Number.isFinite(state.stage[k])&&state.stage[k]>=0))state.stage=stageSpec();if(!Array.isArray(state.ice)||state.ice.length!==state.board.cells.length)state.ice=Array(state.board.cells.length).fill(0);if(!Number.isInteger(state.moves)||state.moves<0)state.moves=15;}

function renderBoard(board=state.board,animate=false){const parent=$('#board'),old=new Map();if(animate)parent.querySelectorAll('.tile').forEach(el=>old.set(el.dataset.uid,el.getBoundingClientRect()));const nodes=new Map([...parent.children].map(el=>[el.dataset.uid,el]));parent.style.setProperty('--rows',board.rows);parent.style.setProperty('--cols',board.cols);

 board.cells.forEach((tile,i)=>{let el=nodes.get(tile.uid);if(!el){el=document.createElement('button');el.className='tile';el.dataset.uid=tile.uid;parent.append(el);}if(el.dataset.kind!==String(tile.kind)){const brand=C.brands[tile.kind];el.innerHTML=`<span class="brand-mark" style="--brand-color:${brand.color}">${brand.svg}</span>`;}el.dataset.cell=i;el.dataset.kind=tile.kind;el.dataset.power=tile.power;el.setAttribute('aria-label',`${C.brands[tile.kind].name}${tile.power?'，'+({row:'整行芯片',col:'整列芯片',bomb:'爆破芯片',color:'万能核心'})[tile.power]:''}，第${Math.floor(i/board.cols)+1}排第${i%board.cols+1}列`);el.style.gridRow=Math.floor(i/board.cols)+1;el.style.gridColumn=i%board.cols+1;el.className='tile'+(tile.power?' power-'+tile.power:'')+(selected===i?' selected':'')+(hints.includes(i)?' hinted':'');el.style.transform='';el.style.transition='';const ice=state.ice[i]||0;const cover=el.querySelector('.ice');if(ice){el.classList.add('ice-'+ice);if(!cover){const node=document.createElement('i');node.className='ice';el.append(node);}}else if(cover)cover.remove();});
 if(animate){const offsets=[];parent.querySelectorAll('.tile').forEach(el=>{const r=el.getBoundingClientRect(),before=old.get(el.dataset.uid);el.style.transition='none';const x=before?before.left-r.left:0,y=before?before.top-r.top:-(r.height+5)*(Math.floor(+el.dataset.cell/board.cols)+1);el.style.transform=`translate(${x}px,${y}px)`;offsets.push(el);});parent.getBoundingClientRect();requestAnimationFrame(()=>{for(const el of offsets){el.style.transition='transform 230ms cubic-bezier(.2,.65,.35,1)';el.style.transform='';}});}

function soundStatus(){const info=A.inspect(),on=state.music||state.sound;$('#sound').classList.toggle('active',on&&info.state==='running');$('#sound-state').textContent=!on?'已静音':info.state==='running'?'声音已开':'点按开声';$('#sound').setAttribute('aria-pressed',String(on&&info.state==='running'));}

function updateTrainingSpeed(oldSpeed){if(!state.training)return;const now=Date.now(),t=state.training,progress=Math.min(1,Math.max(0,(now-t.start)/(t.end-t.start))),duration=C.models[t.tier].seconds/C.gpus[state.gpu].speed*1000;t.start=now-duration*progress;t.end=now+duration*(1-progress);}
function craftGPU(){let crafted=null;while(state.gpuParts>=6){state.gpuParts-=6;if(state.gpu<3){const old=C.gpus[state.gpu].speed;state.gpu++;updateTrainingSpeed(old);crafted=C.gpus[state.gpu].name;}else state.coins+=80;}return crafted;}
function resourceReward(plan,chain){const count=plan.clear.length,maxRun=Math.max(3,...plan.groups.map(g=>g.ids.length)),parts=maxRun>=5?2:plan.creations.length||plan.activated?1:0;const coins=count*2+chain*2,energy=count*3,dataCount=1+(maxRun>=5?1:0)+(chain>=3?1:0),target=state.training?C.models[state.training.tier+1]||C.models[state.training.tier]:nextModel()||C.models[3];state.coins+=coins;state.energy+=energy;state.data[target.domain]+=dataCount;state.gpuParts+=parts;state.cleared+=count;state.stage.cleared+=count;for(const i of plan.clear)if(state.ice[i]>0){state.ice[i]--;if(state.ice[i]===0)state.stage.broken++;}const crafted=craftGPU();return {coins,energy,dataCount,parts,domain:target.domain,crafted,maxRun};}
function celebrateReward(plan,r,chain){const origin=$(`[data-cell="${plan.clear[Math.floor(plan.clear.length/2)]}"]`)||$('#board-shell');burst(plan.clear);flyLoot('coin',origin,$('#bag-coins'));flyLoot('energy',origin,$('#bag-energy'));flyLoot('data',origin,$('#bag-data'));if(r.parts||r.crafted)flyLoot('gpu',origin,$('#bag-gpu'));floatText(origin,'+'+r.energy+' 能量');const power=plan.creations[0]?.power;const title=r.crafted?'获得 '+r.crafted+'！已自动装好':r.parts?'显卡碎片 +'+r.parts+' · 训练数据 +'+r.dataCount:C.datasets[r.domain]+'数据 +'+r.dataCount+' · 已入背包';const detail=r.crafted?'训练速度提升，继续消除就能训练更大模型':`金币 +${r.coins} · 能量 +${r.energy}${power?' · '+({row:'整行芯片诞生',col:'整列芯片诞生',bomb:'爆破芯片诞生',color:'万能核心诞生'})[power]:''}`;rewardCard(title,detail,r.parts||r.crafted?'gpu':'data',!!(r.parts||r.crafted),chain>1?'连锁 ×'+chain:'');A.effect(plan.activated||power?'power':'match',chain);if(chain>1||r.maxRun>=4){const box=$('#combo');box.classList.remove('show');void box.offsetWidth;box.textContent=chain>1?'连锁 ×'+chain:r.maxRun>=5?'五连！万能核心':'四连！算力芯片';box.classList.add('show');}if(plan.activated){const p=gamePoint(origin),line=document.createElement('i');line.className='line-blast';line.style.setProperty('--y',p.y+'px');addEffect(line,450);}if(r.crafted){confetti();toast(r.crafted+'已免费合成，继续变强！');}}
function goalMet(){return state.stage.iceTarget?state.stage.broken>=state.stage.iceTarget:state.stage.cleared>=state.stage.target;}
function finishStage(){if(!goalMet())return;const passed=state.level;state.level++;state.coins+=40;state.energy+=20;const target=nextModel()||C.models[3];state.data[target.domain]+=2;state.gpuParts+=1;craftGPU();state.stage=stageSpec();state.moves=14+Math.min(state.level,7);setIce();rewardCard('第 '+passed+' 关完成！成长宝箱已开启','金币 +40 · 能量 +20 · 数据 +2 · 显卡碎片 +1','gpu',true,'★');A.effect('win');confetti();toast('进入第 '+state.level+' 关，棋盘不停，继续消除！');save();renderBoard();}
async function settle(preferred=null){const token=epoch;busy=true;$('#board').classList.add('busy');let chain=0;try{for(;chain<12;chain++){if(token!==epoch)return;const matches=E.scan(state.board),triggered=state.pendingPower?state.pendingPower.uids.map(uid=>state.board.cells.findIndex(t=>t.uid===uid)).filter(i=>i>=0):[];if(!matches.indices.length&&!triggered.length)break;const targetKind=state.pendingPower?.kind??null;const at=preferred?state.board.cells.findIndex(t=>t.uid===preferred):null;const plan=E.plan(state.board,matches,at,triggered,targetKind);if(!plan.clear.length)break;const reward=resourceReward(plan,chain+1);celebrateReward(plan,reward,chain+1);for(const i of plan.clear)$(`[data-cell="${i}"]`)?.classList.add('clearing');state.board=E.refill(state.board,plan,typeCount(),make);state.pendingPower=null;state.pendingPreferred=null;preferred=null;save();refresh();await wait(185);if(token!==epoch)return;renderBoard(state.board,true);await wait(260);}
 if(token!==epoch)return;if(E.scan(state.board).indices.length||!E.move(state.board)){state.board=E.shuffle(state.board);renderBoard(state.board,true);await wait(240);$('#feedback').textContent='已整理出新的可消除组合';save();}finishStage();}
 catch(error){console.error('resolve failure',error);if(token===epoch){state.pendingPower=null;state.board=E.generate(state.board.rows,6,typeCount(),make);save();renderBoard();toast('已恢复棋盘，获得的资源都已保留。');}}
 finally{if(token===epoch){busy=false;$('#board').classList.remove('busy');refresh();}}}
async function attemptSwap(a,b){if(busy||$('#modal').open||state.moves<=0||!E.adjacent(state.board,a,b))return;busy=true;gestureCount++;selected=null;hints=[];$('#hand').hidden=true;const token=epoch,legal=E.isValidSwap(state.board,a,b),original=state.board,visual={...original,cells:original.cells.slice()};const powers=[original.cells[a],original.cells[b]].filter(t=>t.power);const targetKind=powers.find(t=>t.power==='color')?(original.cells[a].power==='color'?original.cells[b].kind:original.cells[a].kind):null;E.swap(visual,a,b);A.effect('swap');renderBoard(visual,true);$('#board').classList.add('busy');await wait(210);if(token!==epoch)return;if(!legal){renderBoard(original,true);A.effect('error');$('#feedback').textContent='这次还没凑成三连，换个方向试试';await wait(210);if(token===epoch){busy=false;$('#board').classList.remove('busy');}return;}state.board=visual;state.moves--;state.swaps++;$('#instruction').textContent='滑动凑三连 · 四连造芯片 · 五连得万能核心';state.pendingPower=powers.length?{uids:powers.map(t=>t.uid),kind:targetKind}:null;state.pendingPreferred=visual.cells[b].uid;save();refresh();await settle(state.pendingPreferred);}
function pick(index){if(busy||state.moves<=0||$('#modal').open)return;A.effect('pick');if(selected===null){selected=index;renderBoard();return;}if(index===selected){selected=null;renderBoard();return;}if(E.adjacent(state.board,selected,index)){const a=selected;selected=null;attemptSwap(a,index);}else{selected=index;renderBoard();}}
function clearDrag(){if(!drag)return;drag.el.style.transform='';drag.el.classList.remove('dragging');$$('.neighbor').forEach(el=>el.classList.remove('neighbor'));drag=null;}
function startDrag(id,x,y,el,pointer){if(busy||state.moves<=0||$('#modal').open)return;drag={id,x,y,dx:0,dy:0,el,pointer};try{if(pointer!==undefined)el.setPointerCapture(pointer);}catch{}}
function dragMove(x,y){if(!drag)return;drag.dx=x-drag.x;drag.dy=y-drag.y;const r=drag.el.getBoundingClientRect(),horizontal=Math.abs(drag.dx)>Math.abs(drag.dy),dx=horizontal?Math.max(-r.width*.8,Math.min(r.width*.8,drag.dx)):0,dy=!horizontal?Math.max(-r.height*.8,Math.min(r.height*.8,drag.dy)):0;if(Math.max(Math.abs(drag.dx),Math.abs(drag.dy))<7)return;drag.el.classList.add('dragging');drag.el.style.transform=`translate(${dx}px,${dy}px) scale(1.04)`;$$('.neighbor').forEach(el=>el.classList.remove('neighbor'));const offset=horizontal?(drag.dx>0?1:-1):(drag.dy>0?state.board.cols:-state.board.cols),index=drag.id+offset;if(E.adjacent(state.board,drag.id,index))$(`[data-cell="${index}"]`)?.classList.add('neighbor');}

const boardElement=$('#board');if('PointerEvent' in window){boardElement.addEventListener('pointerdown',e=>{const tile=e.target.closest('.tile');if(!tile)return;e.preventDefault();unlock();startDrag(+tile.dataset.cell,e.clientX,e.clientY,tile,e.pointerId);});boardElement.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();dragMove(e.clientX,e.clientY);});boardElement.addEventListener('pointerup',e=>{if(!drag)return;e.preventDefault();unlock();endDrag();});boardElement.addEventListener('pointercancel',()=>clearDrag());}else{boardElement.addEventListener('touchstart',e=>{const t=e.changedTouches[0],tile=e.target.closest('.tile');if(!tile)return;e.preventDefault();unlock();startDrag(+tile.dataset.cell,t.clientX,t.clientY,tile);},{passive:false});boardElement.addEventListener('touchmove',e=>{if(!drag)return;e.preventDefault();const t=e.changedTouches[0];dragMove(t.clientX,t.clientY);},{passive:false});boardElement.addEventListener('touchend',e=>{e.preventDefault();unlock();endDrag();},{passive:false});boardElement.addEventListener('touchcancel',clearDrag);}

function advance(){const now=Date.now(),from=Math.min(now,Math.max(state.last,now-7200000));let gain=(now-from)/1000*rate();if(state.training&&now>=state.training.end){const t=state.training;if(!state.models.includes(t.tier)){state.models.push(t.tier);gain+=Math.max(0,now-Math.max(from,t.end))/1000*C.models[t.tier].rate;const m=C.models[t.tier];rewardCard(m.name+' · '+m.size+' 训练完成！','已自动上线 MaaS，每秒 +'+m.rate+' 金币','gpu',true,'✦');toast(m.name+'诞生了！继续消除，它会一直赚金币。');A.effect('win');confetti();}state.training=null;}state.income+=Math.min(5000,gain);const coins=Math.floor(state.income);if(coins>0){state.income-=coins;state.coins+=coins;if(now-from>60000)toast('离线营业收入 +'+coins+' 金币，已自动收好。');}state.last=now;refresh();save();}
function growMode(){const m=nextModel();if(state.training)return {kind:'busy'};if(!m)return {kind:'done'};if(state.gpu<m.gpu)return {kind:'gpu',cost:C.gpus[m.gpu].cost,ready:state.coins>=C.gpus[m.gpu].cost};if(state.energy<m.energy)return {kind:'energy',ready:false};if(state.data[m.domain]<m.data)return {kind:'data',ready:state.coins>=25};return {kind:'train',ready:true};}

function refresh(){if(!state.board||!state.stage)return;$('#coins').textContent=fmt(state.coins);$('#energy').textContent=fmt(state.energy);$('#data').textContent=state.data.reduce((a,b)=>a+b,0);$('#gpu-parts').textContent=state.gpuParts+'/6';$('#bag-gpu').title=C.gpus[state.gpu].name;$('#game').classList.toggle('training',!!state.training);const current=C.models[state.models.at(-1)],next=nextModel();$('#model-size').textContent=current?current.size:'模型种子';$('#model-name').textContent=current?current.name+' · 我的基座模型':'等你唤醒第一只模型';$('#income-rate').textContent=current?'每秒 +'+rate()+' 金币':'MaaS 等待开张';if(state.training){const t=state.training,left=Math.max(0,Math.ceil((t.end-Date.now())/1000));$('#model-progress').style.width=Math.min(100,(Date.now()-t.start)/(t.end-t.start)*100)+'%';$('#model-note').textContent=C.models[t.tier].name+'正在学习 · '+left+' 秒后诞生';}else{$('#model-progress').style.width=(next?Math.min(100,state.energy/next.energy*100):100)+'%';$('#model-note').textContent=next?'下一只 '+next.size+' · '+C.gpus[state.gpu].name+' 已装好':'小队已到 7B，继续消除挑战更多关卡';}$('#stage-number').textContent='第 '+state.level+' 关';const iceGoal=state.stage.iceTarget,total=iceGoal||state.stage.target,progress=iceGoal?state.stage.broken:state.stage.cleared;$('#goal').textContent=iceGoal?`破冰 ${Math.min(progress,total)} / ${total}`:`消除图标 ${Math.min(progress,total)} / ${total}`;$('#stage-fill').style.width=Math.min(100,progress/total*100)+'%';$('#moves').textContent=state.moves;$('.moves').classList.toggle('urgent',state.moves<=3);$('#extra-moves').hidden=state.moves>0;$('#board-shell').classList.toggle('board-dim',state.moves===0);const mode=growMode(),button=$('#grow');button.disabled=!mode.ready;$('.growth-action').classList.toggle('ready',!!mode.ready);let title,detail,label='下一步的小目标',text;if(mode.kind==='busy'){title='模型正在训练，你可以继续消除';detail='完成后自动开启收益，不用等、不用切页面';text='学习中';}else if(mode.kind==='done'){title='已训练到 7B，继续三消挑战';detail='收益持续自动入账，素材与成长记录都会保存';text='持续成长';}else if(mode.kind==='gpu window.addEventListener('resize',()=>{clearDrag();$('#hand').hidden=true;});window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){clearDrag();A.pause();save();}else{advance();A.resume();}});
